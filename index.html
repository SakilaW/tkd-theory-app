<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz · Taekwon-Do Theory</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="wrap">
<h1>Taekwon-Do Theory (10th Gup - 1st Gup)</h1>
<nav class="site-nav" aria-label="Main navigation">
<a href="index.html" aria-current="page">Quiz</a>
<a href="progress.html">Progress</a>
<a href="question-bank.html">Question Bank</a>
</nav>
</div></header>
<main>
<section class="card" id="setup">
<h2>Set up your quiz</h2>
<div class="controls">
<div class="field"><label for="rank">Belt rank</label><select id="rank"><option value="">All belt ranks</option></select></div>
<div class="field"><label for="topic">Topic</label><select id="topic"><option value="">All topics</option></select></div>
<div class="field"><label for="count">Question count</label><select id="count"><option value="20">20 questions</option><option value="40">40 questions</option><option value="60">60 questions</option><option value="all">All available questions</option></select></div>
</div>
<p id="scope"></p>
<p class="muted">Choose a belt rank, topic, or both. Answers are revealed after you submit. Progress is saved in this browser.</p>
<div class="actions"><button id="start">Start quiz</button></div>
</section>
<section class="card" id="quiz">
<div class="qtop"><span id="qcounter">Question 1</span><span id="qmeta"></span></div>
<div class="progress"><div id="bar"></div></div>
<div class="question" id="questionText"></div><div id="questionMedia"></div><div class="options" id="options"></div>
<div class="actions"><button class="secondary" id="prev">Previous</button><button id="next">Next question</button><button id="submit" style="display:none">Submit quiz</button></div>
<p class="muted" id="answeredCount"></p>
</section>
<section class="card" id="results">
<h2>Quiz results</h2>
<div class="stats">
<div class="stat"><strong id="score">0%</strong><span>Score</span></div>
<div class="stat"><strong id="rightCount">0/0</strong><span>Correct</span></div>
<div class="stat"><strong id="wrongCount">0</strong><span>To revise</span></div>
</div>
<p id="resultMessage"></p>
<div class="actions"><button id="retryWrong">Practise missed questions</button><button class="secondary" id="newQuiz">New quiz</button></div>
<h3>Performance this quiz</h3><div id="resBreak"></div>
<details open><summary>Review answers</summary><div id="reviewList"></div></details>
</section>
</main>
<script src="data.js"></script>
<script src="shared.js"></script>
<script src="quiz.js"></script>
</body>
</html>
